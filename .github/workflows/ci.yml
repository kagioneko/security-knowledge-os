name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pinned)
        run: pip install -e ".[api,llm,dev]" -c constraints.txt
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Publication preflight
        run: python scripts/preflight.py
