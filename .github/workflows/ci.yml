name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # TODO: pin these actions to a full commit SHA for supply-chain safety.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # full history (the manifest-ancestor check needs it)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pinned)
        run: pip install -e ".[api,llm,dev]" -c constraints.txt
      # Mirrors the project's own gate (scripts/preflight.py runs `ruff check`,
      # not `ruff format --check`), so CI enforces exactly what the repo commits
      # to. (`ruff format --check` is not run repo-wide yet - a separate cleanup.)
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (strict)
        run: mypy
      # Two tests assert the tracked sbom.json matches the *exact* installed
      # dependency closure of the maintainer's environment (e.g. build-time
      # packages like trove-classifiers); they cannot pass in an arbitrary CI
      # runner and are verified locally via scripts/preflight.py before a
      # release. Everything else - including the manifest-ancestor check - runs.
      - name: Tests
        run: >
          pytest -q
          --deselect tests/unit/test_generate_sbom.py::test_no_unknown_licences_for_a_real_specific_osi_classifier
          --deselect tests/unit/test_preflight_manifest.py::test_real_tracked_sbom_matches_the_current_environment
