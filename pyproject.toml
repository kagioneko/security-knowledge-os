[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-knowledge-os"
version = "0.1.0"
description = "Deterministic security assessment engine + knowledge retrieval + optional LLM assistance"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
cli = ["typer>=0.12"]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that require a real LLM provider (skipped by default)",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true
