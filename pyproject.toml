[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-knowledge-os"
version = "0.1.0"
description = "Deterministic security assessment engine + knowledge retrieval + optional LLM assistance"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

# Codex cross-review finding #5 (round 4, 2026-09-12): the declared floor
# (previously >=0.110) permits releases predating FastAPI's strict
# content-type checking (introduced 0.132.0), one factor in a
# browser-request repro reaching /v1/assessments. The `_local_origin_gate`
# middleware (app/main.py) is the primary fix and does not depend on this,
# but the floor should match what is actually installed/tested (0.141.1) and
# not silently regress on a future `pip install -e . --upgrade-strategy
# eager` against an older resolver constraint.
[project.optional-dependencies]
api = ["fastapi>=0.132", "uvicorn>=0.29"]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "fastapi>=0.132",
    "httpx>=0.27",
]

[project.scripts]
skos = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that require a real LLM provider (skipped by default)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true
