[build-system]
# Codex#13 (round 7, 2026-09-12): unversioned - a future hatchling release
# with a breaking or vulnerable change would be silently accepted on any
# fresh build. A floor matching what is actually installed/tested still
# leaves room for newer compatible releases, unlike a lock file (which is
# the right tool for a fully reproducible CI/release build - see the note
# on `dev` below).
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "security-knowledge-os"
version = "0.1.0"
description = "Deterministic security assessment engine + knowledge retrieval + optional LLM assistance"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

# Codex cross-review finding #5 (round 4, 2026-09-12): the declared floor
# (previously >=0.110) permits releases predating FastAPI's strict
# content-type checking (introduced 0.132.0), one factor in a
# browser-request repro reaching /v1/assessments. The `_local_origin_gate`
# middleware (app/main.py) is the primary fix and does not depend on this,
# but the floor should match what is actually installed/tested (0.141.1) and
# not silently regress on a future `pip install -e . --upgrade-strategy
# eager` against an older resolver constraint.
[project.optional-dependencies]
api = ["fastapi>=0.132", "uvicorn>=0.29"]
llm = ["anthropic>=0.40"]
dev = [
    # Codex#13 (round 7, 2026-09-12): the previous floor (>=8.0) admits
    # releases affected by the tmpdir-handling vulnerability fixed in
    # 9.0.3 (GHSA-6w46-j5rx-g56g) - the installed 9.1.1 is not affected,
    # but a fresh `pip install -e ".[dev]"` against an older resolver
    # constraint could still land on a vulnerable one.
    "pytest>=9.0.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "fastapi>=0.132",
    "httpx>=0.27",
    # Codex#13 (round 7, 2026-09-12): "reviewed lock/constraints file for
    # CI" and "automated OSV/pip-audit scanning" were both suggested;
    # pip-audit (queries the OSV database for every installed
    # distribution) is the lighter-weight of the two and is wired into
    # scripts/preflight.py. A full lock/constraints file is a bigger,
    # separate maintenance commitment (regenerating and reviewing it on
    # every dependency change) left for a follow-up if this project starts
    # shipping releases on a schedule that needs one.
    "pip-audit>=2.7",
]

[project.scripts]
skos = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that require a real LLM provider (skipped by default)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true
