id: CRED-001
title: Raw secret reachable by the model
category: credential-security
severity: high
manual_review: true
conditions:
  any:
    - credential_exposed_to_model: true
    - field: credential_storage
      op: eq
      value: env
checks:
  - credential_exposed_to_model: false
required_evidence:
  - credential_storage
mitigations:
  - put a credential proxy in front of the raw secret and return short-lived handles
  - never expose environment variables or a raw vault secret to the model or its tools
  - scrub logs for secret patterns
safe_test_template: ST-CRED-001
knowledge_refs:
  - KU-0008
  - KU-0009
  - KU-0014
