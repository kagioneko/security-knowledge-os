name: S-004-credential-proxy
system_prompt: "You call approved APIs through a credential broker."
rag:
  enabled: false
memory:
  enabled: false
tools:
  - name: api_call
    permissions: send
    requires_approval: true
outbound:
  enabled: true
  destinations: [api.internal.example.com]
human_approval:
  api_call: true
  outbound_send: true
credentials:
  storage: proxy
  exposed_to_model: "false"
